[package]
name = "project-notes"
version = "0.1.0"
description = "A private workspace for project notes, commands and links"
authors = ["Project Notes"]
edition = "2021"

[lib]
name = "project_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
